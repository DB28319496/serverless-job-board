<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employer Portal</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="site-header">
    <h1><a href="/">JobBoard</a></h1>
    <nav>
      <button id="logoutBtn" class="btn">Logout</button>
    </nav>
  </header>

  <main>
    <section class="job-form-section">
      <h2>Post a New Job</h2>
      <form id="job-form" class="job-form">
        <input type="text" id="title"     placeholder="Job Title"      required />
        <input type="text" id="company"   placeholder="Company Name"   required />
        <input type="text" id="location"  placeholder="Location"       required />
        <textarea id="description"       
                  placeholder="Job Description" rows="5" required>
        </textarea>
        <input type="url"  id="applyUrl"  placeholder="Apply URL or Email" required />
        <button type="submit" class="btn">Submit Job</button>
      </form>
      <div id="status"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 Your Company</p>
  </footer>

  <script src="portal.js"></script>
</body>
</html>
